
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loobee — Authentication</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101014;color:#f7f7fb;font-family:Arial,sans-serif}
.card{width:100%;max-width:420px;padding:30px;background:#1b1b22;border:1px solid #34343e;border-radius:20px;box-shadow:0 20px 70px #0005}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;font-weight:800;margin-bottom:25px}
.mark{width:44px;height:32px;border-radius:9px;background:#f32642;display:grid;place-items:center;color:white;font-size:21px}
h1{font-size:25px;margin:0 0 8px;text-align:center}
p{color:#aaaab8;text-align:center;line-height:1.5;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:23px 0}
button{border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:700;font-size:14px}
.tab{background:#292932;color:#eee}
.tab.active{background:#f32642}
label{display:block;margin:14px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #3c3c47;background:#111116;border-radius:9px;color:white;font-size:15px}
input:focus{outline:2px solid #8b5cf6}
.submit{width:100%;background:#f32642;color:white;margin-top:19px}
.google{width:100%;background:#fff;color:#222;margin-top:10px}
.divider{display:flex;align-items:center;gap:10px;color:#888;margin:17px 0;font-size:12px}
.divider:before,.divider:after{content:"";height:1px;background:#383842;flex:1}
.status{font-size:13px;padding:10px;border-radius:8px;overflow-wrap:anywhere}
.error{color:#ffb1bb;background:#421b24}
.success{color:#b2f2c5;background:#173424}
.hidden{display:none}
.back{display:block;margin:20px auto 0;text-align:center;color:#c4b5fd;text-decoration:none}
small{display:block;color:#888;font-size:12px;line-height:1.5;margin-top:17px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="mark">L</span> Loobee</div>
  <h1 id="heading">Welcome back</h1>
  <p id="subtitle">Sign in to your Loobee account.</p>

  <div class="tabs">
    <button class="tab active" id="loginTab" type="button">Sign in</button>
    <button class="tab" id="signupTab" type="button">Create account</button>
  </div>

  <form id="form">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters">

    <button class="submit" id="submit" type="submit">Sign in</button>
  </form>

  <div class="divider">OR</div>
  <button class="google" id="google" type="button">Continue with Google</button>

  <div id="status" class="status hidden" role="status" aria-live="polite"></div>

  <a class="back" href="https://lowvr81-sudo.github.io/loobee/">← Back to Loobee</a>
  <small>Your account is managed securely by Supabase. Never share your password or verification links.</small>
</div>

<script>
const SUPABASE_URL = "https://npnxfvqnjdvqgyecoxdu.supabase.co";
const SUPABASE_KEY = "sb_publishable_jH73fmYtkQ1Vkz2BsrK4Wg_SSZFvcjB";

const LOOBEE_URL = "https://lowvr81-sudo.github.io/loobee/";
const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_KEY.includes("PASTE_");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

let mode = "login";
const $ = id => document.getElementById(id);

function showStatus(text, type="error") {
  const box = $("status");
  box.textContent = text;
  box.className = "status " + type;
}

function setMode(next) {
  mode = next;
  const signup = mode === "signup";
  $("heading").textContent = signup ? "Join Loobee" : "Welcome back";
  $("subtitle").textContent = signup
    ? "Create your account and start watching."
    : "Sign in to your Loobee account.";
  $("submit").textContent = signup ? "Create account" : "Sign in";
  $("loginTab").classList.toggle("active", !signup);
  $("signupTab").classList.toggle("active", signup);
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("status").className = "status hidden";
}

$("loginTab").onclick = () => setMode("login");
$("signupTab").onclick = () => setMode("signup");

$("form").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    showStatus("Setup needed: add your Supabase Project URL and Publishable key to this file.");
    return;
  }

  $("submit").disabled = true;
  $("submit").textContent = "Please wait…";

  const email = $("email").value.trim();
  const password = $("password").value;

  try {
    if (mode === "signup") {
      const {data, error} = await db.auth.signUp({
        email,
        password,
        const LOOBEE_URL = "https://lowvr81-sudo.github.io/loobee/";
      });

      if (error) throw error;

      if (data.session) {
        showStatus("Account created! Opening Loobee…", "success");
        location.replace(LOOBEE_URL);
      } else {
        showStatus("Account created. Check your email to confirm your address, then sign in.", "success");
      }
    } else {
      const {error} = await db.auth.signInWithPassword({email, password});
      if (error) throw error;

      showStatus("Signed in! Opening Loobee…", "success");
      location.replace(LOOBEE_URL);
    }
  } catch (error) {
    showStatus(error.message || "Authentication failed.");
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = mode === "signup" ? "Create account" : "Sign in";
  }
});

$("google").onclick = async () => {
  if (!db) {
    showStatus("Setup needed: add your Supabase Project URL and Publishable key to this file.");
    return;
  }

  $("google").disabled = true;
  $("google").textContent = "Connecting to Google…";

  try {
    const {error} = await db.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: LOOBEE_URL }
    });

    if (error) throw error;
  } catch (error) {
    showStatus(error.message || "Google sign-in failed.");
    $("google").disabled = false;
    $("google").textContent = "Continue with Google";
  }
};

async function checkSession() {
  if (!db) return;

  const {data, error} = await db.auth.getSession();
  if (error) {
    showStatus(error.message);
    return;
  }

  if (data.session) {
    showStatus("You're already signed in. Opening Loobee…", "success");
    location.replace(LOOBEE_URL);
  }
}

checkSession();
</script>
</body>
</html>
