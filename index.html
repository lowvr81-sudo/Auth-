
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loobee Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#101010;color:white;font-family:Arial,sans-serif;padding:20px
}
.card{
  width:100%;max-width:400px;background:#1b1b1b;padding:30px;
  border:1px solid #333;border-radius:20px
}
.logo{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px}
.logo span{background:#ff0033;border-radius:12px;padding:10px 16px;font-size:27px;font-weight:bold}
h1{margin:0;font-size:29px}
p{text-align:center;color:#aaa}
label{display:block;margin:15px 0 7px}
input,button{
  width:100%;padding:13px;border-radius:9px;font-size:15px
}
input{background:#111;color:white;border:1px solid #444}
button{border:0;margin-top:13px;cursor:pointer;font-weight:bold}
.red{background:#ff0033;color:white}
.google{background:white;color:#222}
.other{background:#303030;color:white;border:1px solid #444}
#status{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span>L</span><h1>Loobee</h1></div>
  <p id="heading">Sign in to your account</p>

  <button class="google" onclick="googleLogin()">Continue with Google</button>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" minlength="6"
           autocomplete="current-password" required>

    <button class="red" id="submit" type="submit">Sign in</button>
  </form>

  <button class="other" id="toggle">Create an account</button>
  <button class="other" onclick="location.href=LOOBEE_URL">Back to Loobee</button>
  <p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://npnxfvqnjdvqgyecoxdu.supabase.co";
const SUPABASE_KEY = "sb_publishable_jH73fmYtkQ1Vkz2BsrK4Wg_SSZFvcjB";
const LOOBEE_URL = "https://lowvr81-sudo.github.io/loobee/";
const AUTH_URL = "https://lowvr81-sudo.github.io/Auth-/";

const status = document.getElementById("status");
const form = document.getElementById("form");
let signup = false;
let db = null;

function say(text){
  status.textContent = text;
}

if (SUPABASE_KEY !== "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY") {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  db.auth.getSession().then(({data}) => {
    if (data.session) location.replace(LOOBEE_URL);
  });

  db.auth.onAuthStateChange((event, session) => {
    if (session && event === "SIGNED_IN") {
      location.replace(LOOBEE_URL);
    }
  });
}

async function googleLogin(){
  if (!db) return say("Add your Supabase publishable key in the HTML first.");

  const {error} = await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:AUTH_URL}
  });

  if(error) say(error.message);
}

document.getElementById("toggle").onclick = () => {
  signup = !signup;
  document.getElementById("heading").textContent =
    signup ? "Create your account" : "Sign in to your account";
  document.getElementById("submit").textContent =
    signup ? "Sign up" : "Sign in";
  document.getElementById("toggle").textContent =
    signup ? "Already have an account? Sign in" : "Create an account";
  document.getElementById("password").autocomplete =
    signup ? "new-password" : "current-password";
  say("");
};

form.onsubmit = async event => {
  event.preventDefault();

  if (!db) return say("Add your Supabase publishable key in the HTML first.");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  let result;

  if (signup) {
    result = await db.auth.signUp({
      email,
      password,
      options:{emailRedirectTo:AUTH_URL}
    });
  } else {
    result = await db.auth.signInWithPassword({email,password});
  }

  if (result.error) return say(result.error.message);

  if (signup && !result.data.session) {
    say("Account created! Check your email to confirm your account.");
  } else {
    location.replace(LOOBEE_URL);
  }
};
</script>
</body>
</html>
